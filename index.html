<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMNTY - Ecosistema Nocturno</title>
    <!-- FontAwesome para iconos oficiales de marcas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Fondo que simula un mar profundo de noche con oleaje sutil de gradiente */
            background: linear-gradient(180deg, #020408, #050b18, #0b1d3a, #030813);
            background-size: 100% 300%;
            animation: tideMovement 18s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes tideMovement {
            0% { background-position: 50% 0%; }
            50% { background-position: 50% 100%; }
            100% { background-position: 50% 0%; }
        }

        /* Cielo estrellado animado con parpadeo y profundidad */
        .stars-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #00ffff, 0 0 15px #ffffff; }
        }

        /* Efecto de reflejos de luz lunar / bioluminiscencia sutil en el fondo del mar */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(100, 200, 255, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 20% 80%, rgba(0, 255, 200, 0.04) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(5, 12, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(100, 210, 255, 0.25);
            border-radius: 22px;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.2), inset 0 0 30px rgba(0, 255, 255, 0.03);
            padding: 40px;
            animation: fadeIn 0.8s ease-in-out;
            z-index: 2;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2.6rem;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 220, 255, 0.8), 0 0 25px rgba(0, 150, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        header p {
            color: #93c5fd;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(147, 197, 253, 0.4);
        }

        .grid-redes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Tarjetas de redes con estilo cristal marino nocturno */
        .card-red {
            background: rgba(10, 25, 50, 0.8);
            border: 2px solid rgba(30, 58, 138, 0.6);
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            color: #93c5fd;
        }

        .card-red:hover {
            transform: translateY(-6px) scale(1.03);
            background: rgba(15, 35, 70, 0.9);
            border-color: rgba(100, 200, 255, 0.8);
        }

        .card-red i {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s ease;
        }

        .card-red:hover i {
            transform: scale(1.15) rotate(5deg);
        }

        .card-red span {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: block;
        }

        /* Destellos específicos por red con temática oceánica y estelar */
        .card-red[data-red="facebook"]:hover, .card-red.active[data-red="facebook"] {
            border-color: #1877f2;
            box-shadow: 0 0 25px rgba(24, 119, 242, 0.6), inset 0 0 12px rgba(24, 119, 242, 0.3);
            color: #1877f2;
        }

        .card-red[data-red="instagram"]:hover, .card-red.active[data-red="instagram"] {
            border-color: #e1306c;
            box-shadow: 0 0 25px rgba(225, 48, 108, 0.6), inset 0 0 12px rgba(225, 48, 108, 0.3);
            color: #e1306c;
        }

        .card-red[data-red="tiktok"]:hover, .card-red.active[data-red="tiktok"] {
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6), inset 0 0 12px rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        .card-red[data-red="x"]:hover, .card-red.active[data-red="x"] {
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.3);
            color: #ffffff;
        }

        #panel-resultado {
            background: rgba(3, 8, 20, 0.9);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(50, 100, 180, 0.4);
            display: none;
            margin-top: 20px;
            animation: slideUp 0.4s ease;
        }

        #panel-resultado h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px currentColor;
        }

        .info-group {
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        .info-group strong {
            color: #e2e8f0;
        }

        .btn-visitar {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: transparent;
            color: #fff;
            border: 2px solid currentColor;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px currentColor;
        }

        .btn-visitar:hover {
            background: currentColor;
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 25px currentColor;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Contenedor del cielo estrellado sobre el mar nocturno -->
    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        <header>
            <h1>SCMNTY</h1>
            <p>Bajo un mar de estrellas y marea nocturna. Selecciona una plataforma:</p>
        </header>

        <div class="grid-redes">
            <div class="card-red" data-red="facebook" onclick="seleccionarRed('facebook')">
                <i class="fa-brands fa-facebook"></i>
                <span>Facebook</span>
            </div>
            <div class="card-red" data-red="instagram" onclick="seleccionarRed('instagram')">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </div>
            <div class="card-red" data-red="tiktok" onclick="seleccionarRed('tiktok')">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </div>
            <div class="card-red" data-red="x" onclick="seleccionarRed('x')">
                <i class="fa-brands fa-x-twitter"></i>
                <span>X</span>
            </div>
        </div>

        <div id="panel-resultado">
            <h2 id="res-nombre">Plataforma</h2>
            <div class="info-group"><strong>Formato Estrella:</strong> <span id="res-formato"></span></div>
            <div class="info-group"><strong>Público Objetivo:</strong> <span id="res-publico"></span></div>
            <div class="info-group"><strong>Estrategia de Crecimiento:</strong> <span id="res-estrategia"></span></div>
            <a id="res-link" href="#" target="_blank" class="btn-visitar">Visitar Red Social ➔</a>
        </div>
    </div>

    <script>
        // Generador dinámico de estrellas hermosas parpadeantes en el fondo
        const numStars = 65;
        const container = document.getElementById('starsContainer');

        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Posición aleatoria
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Tamaño variable (algunas más grandes y brillantes)
            const size = Math.random() * 2.5 + 1;
            
            // Duración de parpadeo aleatoria para efecto natural
            const duration = Math.random() * 4 + 2; 

            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${duration}s`);
            
            // Retraso aleatorio en la animación
            star.style.animationDelay = `${Math.random() * 5}s`;

            container.appendChild(star);
        }

        const datosRedes = {
            facebook: {
                nombre: "Facebook (Conexión Comunitaria)",
                color: "#1877f2",
                url: "https://www.facebook.com/marcos.corella.948792",
                formato: "Videos largos, Carruseles informativos y Grupos de nicho.",
                publico: "Adultos jóvenes, adultos contemporáneos y comunidades locales (25 - 55+ años).",
                estrategia: "Fomentar la interacción en comunidades cerradas, pauta publicitaria hipersegmentada y generación de leads conversacionales."
            },
            instagram: {
                nombre: "Instagram (Impacto Visual y Estética)",
                color: "#e1306c",
                url: "https://www.instagram.com/scmmnty",
                formato: "Reels dinámicos, Historias interactivas y publicaciones estéticas en cuadrícula.",
                publico: "Millennials y Generación Z (18 - 35 años) enfocados en estilo de vida, marcas y diseño.",
                estrategia: "Consistencia visual absoluta, alianzas con creadores (influencers) y uso estratégico de tendencias en audio para Reels."
            },
            tiktok: {
                nombre: "TikTok (Viralidad y Entretenimiento)",
                color: "#00f2fe",
                url: "https://www.tiktok.com/@srsocram01",
                formato: "Videos cortos verticales de alto ritmo (9 a 30 segundos) con edición orgánica.",
                publico: "Generación Z y audiencia nativa digital (14 - 28 años).",
                estrategia: "Autenticidad sin filtros, enganche en los primeros 3 segundos, participación en retos virales y constancia diaria."
            },
            x: {
                nombre: "X / Twitter (Debate y Actualidad)",
                color: "#ffffff",
                url: "https://x.com",
                formato: "Hilos analíticos, encuestas en tiempo real y micro-updates conversacionales.",
                publico: "Creadores de opinión, tecnólogos, periodistas, gamers y entusiastas de la industria.",
                estrategia: "Liderazgo de opinión (*thought leadership*), participación ágil en temas de tendencia (*trending topics*) y debate transparente."
            }
        };

        function seleccionarRed(redKey) {
            document.querySelectorAll('.card-red').forEach(card => {
                card.classList.remove('active');
            });

            const selectedCard = document.querySelector(`[data-red="${redKey}"]`);
            selectedCard.classList.add('active');

            const data = datosRedes[redKey];
            const panel = document.getElementById('panel-resultado');
            
            document.getElementById('res-nombre').innerText = data.nombre;
            document.getElementById('res-nombre').style.color = data.color;
            document.getElementById('res-formato').innerText = data.formato;
            document.getElementById('res-publico').innerText = data.publico;
            document.getElementById('res-estrategia').innerText = data.estrategia;
            
            const btnLink = document.getElementById('res-link');
            btnLink.href = data.url;
            btnLink.style.color = data.color;
            btnLink.style.borderColor = data.color;

            panel.style.display = 'block';
            panel.style.borderColor = data.color;
            panel.style.boxShadow = `0 0 20px ${data.color}44`;
        }
    </script>
</body>
</html>
